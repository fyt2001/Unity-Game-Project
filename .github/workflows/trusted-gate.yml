# Trusted gate (poteto step 3): run the PR base's scripts against the PR head.
# A PR cannot turn itself green by editing the gate. EditMode/PlayMode stay local
# (Unity license); this job is GATE-TAMPER + verify.ps1 -Fast only.
name: trusted-gate

on:
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: trusted-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  trusted-gate:
    name: trusted-gate
    runs-on: windows-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Required to build Lua on Windows. ilammy/msvc-dev-cmd is what
      # luarocks/gh-actions-lua documents; it is a no-op on non-Windows.
      - name: MSVC dev prompt
        uses: ilammy/msvc-dev-cmd@v1

      # leafo/gh-actions-luarocks@v4 runs Unix ./configure on Windows and fails.
      # luarocks/gh-actions-* @v11/@v6 are the maintained fork with Windows support.
      - name: Install Lua 5.5.0
        uses: luarocks/gh-actions-lua@v11
        with:
          luaVersion: "5.5.0"

      # v6 defaults to LuaRocks 3.12.2, which does not support Lua 5.5.
      # 3.13.0 is the first release that does; without it, luacheck's
      # luafilesystem 1.9.0 fails: lua.h does not match Lua version 5.5.
      - name: Install LuaRocks
        uses: luarocks/gh-actions-luarocks@v6
        with:
          luaRocksVersion: "3.13.0"

      - name: Install luacheck 1.2.0
        run: luarocks install luacheck 1.2.0
        shell: powershell

      - name: Run trusted gate from PR base
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $base = "${{ github.event.pull_request.base.sha }}"
          $head = "${{ github.event.pull_request.head.sha }}"
          if (-not $base -or -not $head) { throw "missing PR base/head sha" }
          $runner = Join-Path $env:RUNNER_TEMP "verify_from_main.ps1"
          $text = & git show ($base + ":tools/trusted/verify_from_main.ps1")
          if ($LASTEXITCODE -ne 0) { throw "PR base has no tools/trusted/verify_from_main.ps1" }
          [IO.File]::WriteAllText($runner, (($text -join "`r`n") + "`r`n"), (New-Object Text.ASCIIEncoding))
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File $runner -Repo $env:GITHUB_WORKSPACE -Target $head -TrustedRef $base
          exit $LASTEXITCODE
